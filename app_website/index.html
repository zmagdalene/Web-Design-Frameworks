<!doctype html>
<html lang="en-IE">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>
    Week 03 starter — Compass header/nav, support cells &amp; filter row
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css" />
</head>

<body class="bg-[url('/images/homepage.png')] bg-[length:100%_100%] bg-center bg-no-repeat w-screen h-screen">
  <header class="opacity-50">
    <div class="flex justify-between items-start bg-primary py-space-3">
      <div class="flex items-center pl-space-6">
        <img src="images/logo.svg" alt="logo">
        <h3 class="font-bold">Nav</h3>
        <h3>See</h3>
      </div>

      <div class="flex items-center gap-space-8 p-space-2">
        <div class="flex gap-space-9">
          <p>Explore</p>
          <p>Features</p>
          <p>Routes</p>
        </div>

        <div class="flex gap-space-5">
          <button>Get App</button>
          <button>SignUp</button>
        </div>
      </div>
    </div>
  </header>

  <main class="grid grid-cols-12 hidden">
    <section class="col-span-full">
      <img src="images/hero.png" alt="hero" class="w-full h-[70vh]">
    </section>
  </main>

  <footer>
  </footer>
</body>

</html>
